# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title:
  de: Wirkungen des elektrischen Stroms
  en: Effects of electric current
description:
  de: Strom kann Wärme, Licht und Magnetismus erzeugen. Damit funktionieren viele Geräte.
  en: Current can produce heat, light and magnetism. Many devices work this way.
blocks:
  - type: section
    id: idee
    title:
      de: Die Idee
      en: The idea
    blocks:
      - type: text
        text:
          de: |
            Du kannst Strom nicht sehen. Aber du siehst, was er macht: Er lässt Lampen leuchten, Toaster heiß werden und
            Klingeln läuten. Diese Dinge heißen **Wirkungen des Stroms**.
          en: |
            You cannot see current. But you can see what it does: it makes lamps shine, toasters hot and bells ring.
            These things are called **effects of current**.
  - type: section
    id: merke
    title:
      de: Das merkst du dir
      en: What to remember
    blocks:
      - type: table
        caption:
          de: Wirkungen des elektrischen Stroms mit Beispielen
          en: Effects of electric current, with examples
        header:
          - de: Wirkung
            en: Effect
          - de: Was passiert
            en: What happens
          - de: Beispiel
            en: Example
        rowHeaders: true
        rows:
          - - de: Wärmewirkung
              en: Heating effect
            - de: Der Draht wird warm oder heiß
              en: The wire gets warm or hot
            - de: Toaster, Föhn, Herdplatte, Glühlampe
              en: Toaster, hairdryer, hob, incandescent bulb
          - - de: Lichtwirkung
              en: Light effect
            - de: Der Strom bringt etwas zum Leuchten
              en: The current makes something glow
            - de: LED-Lampe, Leuchtstoffröhre
              en: LED lamp, fluorescent tube
          - - de: Magnetwirkung
              en: Magnetic effect
            - de: Der Strom erzeugt ein Magnetfeld
              en: The current creates a magnetic field
            - de: Klingel, Elektromagnet am Kran
              en: Bell, electromagnet on a crane
      - type: text
        text:
          de: |
            Jede dieser Wirkungen kannst du nutzen. Manchmal tritt auch eine Wirkung auf, die du nicht willst: Ein dünnes
            Kabel, durch das zu viel Strom fließt, wird heiß. Das kann einen Brand auslösen.
          en: |
            You can use each of these effects. Sometimes an effect occurs that you do not want: a thin cable with too
            much current flowing through it gets hot. That can start a fire.
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Die elektrische Klingel
          en: The electric bell
        blocks:
          - type: text
            text:
              de: |
                Drückst du den Klingelknopf, fließt Strom durch eine Spule. Sie wird zum **Elektromagneten**, zieht
                einen kleinen Hammer an und schlägt gegen die Glocke. Das ist die Magnetwirkung des Stroms.
              en: |
                When you press the bell button, current flows through a coil. It becomes an **electromagnet**, pulls
                a small hammer towards it and strikes the bell. That is the magnetic effect of current.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: matching
        id: wk-zuordnen
        text:
          de: Ordne jedes Gerät der Wirkung des Stroms zu, die es hauptsächlich nutzt.
          en: Match each device with the effect of current it mainly uses.
        pairs:
          - left:
              de: Toaster
              en: Toaster
            right:
              de: Wärmewirkung
              en: Heating effect
          - left:
              de: LED-Taschenlampe
              en: LED torch
            right:
              de: Lichtwirkung
              en: Light effect
          - left:
              de: Klingel
              en: Bell
            right:
              de: Magnetwirkung
              en: Magnetic effect
        explanation:
          de:
            Der Toaster erhitzt Drähte, die LED-Taschenlampe bringt eine Leuchtdiode zum Leuchten, und die Klingel nutzt einen
            Elektromagneten.
          en: The toaster heats wires, the LED torch makes a light-emitting diode shine, and the bell uses an electromagnet.
        links:
          - title:
              de: Elektromagnet (Wikipedia)
              en: Elektromagnet (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Elektromagnet
      - type: true-false
        id: wk-kabel
        text:
          de: Fließt durch ein dünnes Kabel zu viel Strom, kann es heiß werden.
          en: If too much current flows through a thin cable, it can get hot.
        answer: true
        explanation:
          de: Das ist die Wärmewirkung des Stroms. Zu viel Strom macht ein dünnes Kabel heiß und kann einen Brand verursachen.
          en: That is the heating effect of current. Too much current makes a thin cable hot and can cause a fire.
        links:
          - title:
              de: Elektrischer Strom (Wikipedia)
              en: Elektrischer Strom (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Elektrischer_Strom
      - type: single-choice
        id: wk-gluehlampe
        text:
          de: Welche Wirkung des Stroms nutzt eine Glühlampe, damit sie leuchtet?
          en: Which effect of current does an incandescent bulb use to shine?
        options:
          - text:
              de: Der dünne Draht in der Lampe wird so heiß, dass er glüht.
              en: The thin wire in the bulb gets so hot that it glows.
            correct: true
            info:
              de: Der Draht erhitzt sich durch den Strom und sendet dabei Licht aus. Die Wärmewirkung erzeugt hier das
                Licht.
              en: The wire heats up because of the current and gives off light. The heating effect creates the light here.
          - text:
              de: Ein Magnet zieht ein Teil in der Lampe an.
              en: A magnet attracts a part inside the bulb.
            correct: false
            info:
              de: Magnetwirkung nutzt zum Beispiel die Klingel, nicht die Glühlampe.
              en: The magnetic effect is used by a bell, for example, not by an incandescent bulb.
          - text:
              de: Das Glas der Lampe wird vom Strom aufgeladen.
              en: The glass of the bulb is charged by the current.
            correct: false
            info:
              de: Das Glas ist ein Nichtleiter und leuchtet nicht selbst.
              en: The glass is an insulator and does not shine by itself.
        explanation:
          de: In der Glühlampe wird ein dünner Draht durch den Strom so heiß, dass er glüht und Licht abgibt.
          en: In an incandescent bulb a thin wire is heated by the current until it glows and gives off light.
        links:
          - title:
              de: Glühlampe (Wikipedia)
              en: Glühlampe (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Glühlampe
