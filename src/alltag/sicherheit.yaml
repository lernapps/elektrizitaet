# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title:
  de: Sicher mit Strom umgehen
  en: Staying safe with electricity
description:
  de: Steckdose, Batterie und Gewitter. Du lernst, was gefährlich ist und was nicht.
  en: Sockets, batteries and thunderstorms. You learn what is dangerous and what is not.
blocks:
  - type: section
    id: idee
    title:
      de: Die Idee
      en: The idea
    blocks:
      - type: text
        text:
          de: |
            Strom ist nützlich, kann aber gefährlich sein. Die Batterie in deiner Taschenlampe ist ungefährlich. Der Strom
            aus der Steckdose kann dich dagegen **lebensgefährlich verletzen**. Wer die Regeln kennt, bleibt sicher.
          en: |
            Electricity is useful but can be dangerous. The battery in your torch is harmless. The current from a
            socket, on the other hand, can **injure you fatally**. If you know the rules, you stay safe.
  - type: section
    id: merke
    title:
      de: Das merkst du dir
      en: What to remember
    blocks:
      - type: definition
        term:
          de: Sicherung
          en: Fuse
        explanation:
          de: Eine Sicherung unterbricht den Stromkreis automatisch, wenn zu viel Strom fließt, zum Beispiel bei einem
            Kurzschluss. Das schützt vor Bränden.
          en: A fuse breaks the circuit automatically when too much current flows, for example in a short circuit. This
            protects against fires.
      - type: text
        text:
          de: |
            Diese Regeln solltest du kennen:
            - Stecke **nie** Gegenstände in eine Steckdose, auch keine Nadeln oder Gabeln.
            - Fasse elektrische Geräte **nie mit nassen Händen** an, und benutze sie nicht in der Badewanne.
            - Ziehe am **Stecker**, nicht am Kabel, und benutze keine Geräte mit beschädigtem Kabel.
            - **Experimentiere nie mit Strom aus der Steckdose.** Für Versuche nimmst du nur Batterien.
            - **Bei Gewitter** bleibst du im Haus oder im Auto. Auf freiem Feld und unter einzelnen Bäumen bist du in Gefahr.
          en: |
            You should know these rules:
            - **Never** put objects into a socket, not even needles or forks.
            - **Never** touch electrical devices **with wet hands**, and do not use them in the bathtub.
            - Pull on the **plug**, not on the cable, and do not use devices with a damaged cable.
            - **Never experiment with current from the socket.** For experiments use batteries only.
            - **In a thunderstorm** stay indoors or in a car. In an open field and under lone trees you are in danger.
      - type: note
        title:
          de: Batterie und Steckdose
          en: Battery and socket
        blocks:
          - type: text
            text:
              de: |
                Eine Flachbatterie hat 4,5 Volt und ist für dich ungefährlich. Die Steckdose liefert 230 Volt. Das ist
                viel zu viel für deinen Körper.
              en: |
                A flat battery has 4.5 volts and is harmless to you. The socket supplies 230 volts. That is far too much
                for your body.
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Ein Föhn fällt in die Badewanne
          en: A hairdryer falls into the bathtub
        blocks:
          - type: text
            text:
              de: |
                Wasser leitet den Strom, und dein Körper auch. Deshalb darf kein elektrisches Gerät in die Nähe von
                Badewasser. Bade nie mit angeschlossenem Gerät, und stelle keine Geräte an den Rand der Wanne.
              en: |
                Water conducts electricity, and so does your body. That is why no electrical device may come near bath
                water. Never bathe with a device plugged in, and do not put devices on the edge of the tub.
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: multiple-choice
        id: si-sicher
        text:
          de: Was ist sicher?
          en: What is safe?
        options:
          - text:
              de: Mit einer Taschenlampenbatterie ein Lämpchen zum Leuchten bringen.
              en: Making a small bulb shine with a torch battery.
            correct: true
            info:
              de: Eine kleine Batterie hat nur wenige Volt und ist für dich ungefährlich.
              en: A small battery has only a few volts and is harmless to you.
          - text:
              de: Beim Ziehen des Steckers den Stecker anfassen, nicht das Kabel.
              en: Pulling the plug by the plug, not by the cable.
            correct: true
            info:
              de: Das Kabel kann beim Ziehen beschädigt werden. Am Stecker zu ziehen ist richtig.
              en: The cable can be damaged when you pull it. Pulling on the plug is right.
          - text:
              de: Mit einer Gabel in der Steckdose stochern.
              en: Poking a fork into the socket.
            correct: false
            info:
              de: Die Steckdose hat 230 Volt. Das kann dich lebensgefährlich verletzen.
              en: The socket has 230 volts. That can injure you fatally.
          - text:
              de: Einen Föhn mit nassen Händen anfassen.
              en: Touching a hairdryer with wet hands.
            correct: false
            info:
              de: Nasse Haut leitet den Strom gut. Das macht einen Stromschlag sehr gefährlich.
              en: Wet skin conducts electricity well. That makes an electric shock very dangerous.
        explanation:
          de: Batterien mit wenigen Volt sind ungefährlich. Bei der Steckdose mit 230 Volt gelten strenge Regeln.
          en: Batteries with a few volts are harmless. For the socket with 230 volts strict rules apply.
        links:
          - title:
              de: Stromunfall (Wikipedia)
              en: Stromunfall (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Stromunfall
      - type: single-choice
        id: si-gewitter
        text:
          de: Ein Gewitter zieht auf, und du bist auf einer Wiese. Was tust du?
          en: A thunderstorm is coming and you are in a meadow. What do you do?
        options:
          - text:
              de: Ich gehe in ein Gebäude oder in ein Auto.
              en: I go into a building or into a car.
            correct: true
            info:
              de: In Gebäuden und Autos bist du vor Blitzen gut geschützt.
              en: In buildings and cars you are well protected from lightning.
          - text:
              de: Ich stelle mich unter einen einzelnen großen Baum.
              en: I stand under a single big tree.
            correct: false
            info:
              de: Einzelne hohe Bäume werden oft vom Blitz getroffen. Das ist gefährlich.
              en: Lone tall trees are often struck by lightning. That is dangerous.
          - text:
              de: Ich bleibe mitten auf der Wiese und stehe aufrecht.
              en: I stay in the middle of the meadow and stand upright.
            correct: false
            info:
              de: Auf freiem Feld bist du der höchste Punkt, und der Blitz kann dich treffen.
              en: In an open field you are the highest point, and lightning can strike you.
        explanation:
          de: Bei Gewitter suchst du einen geschützten Ort wie ein Gebäude oder ein Auto und meidest freie Flächen und
            einzelne Bäume.
          en: In a thunderstorm you look for a safe place such as a building or a car and avoid open areas and lone
            trees.
        links:
          - title:
              de: Blitzschlag (Wikipedia)
              en: Blitzschlag (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Blitzschlag
      - type: true-false
        id: si-sicherung
        text:
          de: Eine Sicherung unterbricht den Stromkreis, wenn zu viel Strom fließt.
          en: A fuse breaks the circuit when too much current flows.
        answer: true
        explanation:
          de: Die Sicherung schaltet bei einer Überlastung oder einem Kurzschluss ab. So wird verhindert, dass Kabel
            zu heiß werden.
          en: The fuse switches off in an overload or a short circuit. This stops cables from getting too hot.
        links:
          - title:
              de: Schmelzsicherung (Wikipedia)
              en: Schmelzsicherung (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Schmelzsicherung
