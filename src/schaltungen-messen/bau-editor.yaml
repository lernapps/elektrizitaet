            readAmmeter:
              de: "Amperemeter an Platz {n}: {v}"
              en: "Ammeter at place {n}: {v}"
            readVoltmeter:
              de: "Voltmeter an Platz {n}: {v}"
              en: "Voltmeter at place {n}: {v}"
            noReading:
              de: Noch kein Messgerät eingebaut.
              en: No meter built in yet.
            readings:
              de: "Anzeigen:"
              en: "Readings:"
            short:
              de: Kurzschluss! Im Stromkreis sitzt kein Widerstand, und der Strom wäre viel zu groß. Die Messgeräte
                zeigen nichts an.
              en: Short circuit! There is no resistor in the circuit, and the current would be far too large. The meters
                show nothing.
            bypass:
              de: "Ein Zweig ohne Widerstand überbrückt den anderen: Der Strom fließt nur durch den Draht."
              en: "A branch without a resistor bypasses the other: the current flows only through the wire."
            taskLabel:
              de: "Aufgabe:"
              en: "Task:"
            taskStrom:
              de: Die Quelle hat {U} V. Baue eine Schaltung, in der ein Amperemeter in der Hauptleitung (Platz 1 oder
                4) {T} A zeigt.
              en: The source has {U} V. Build a circuit in which an ammeter in the main wire (place 1 or 4) shows {T}
                A.
            taskSpannung:
              de: Die Quelle hat {U} V. Baue eine Schaltung, in der ein Voltmeter an einem Widerstand {T} V zeigt.
              en: The source has {U} V. Build a circuit in which a voltmeter across a resistor shows {T} V.
            taskParallel:
              de: Die Quelle hat {U} V. Setze in jeden Zweig (Platz 2 und 3) einen Widerstand. Ein Amperemeter in der
                Hauptleitung soll {T} A zeigen.
              en: The source has {U} V. Put a resistor into each branch (places 2 and 3). An ammeter in the main wire
                should show {T} A.
