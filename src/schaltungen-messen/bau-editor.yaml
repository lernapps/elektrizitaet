# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title:
  de: Bau-Editor mit Messgeräten
  en: Circuit builder with meters
description:
  de: Baue Schaltungen mit Widerständen und Messgeräten, die vorgegebene Werte erreichen. Bei jeder Aufgabe sind
    die Zahlen neu.
  en: Build circuits with resistors and meters that reach given values. The numbers are new with every task.
blocks:
  - type: section
    id: idee
    title:
      de: Die Idee
      en: The idea
    blocks:
      - type: text
        text:
          de: "Jetzt baust du Schaltungen, die bestimmte Werte erreichen. Du bekommst eine Aufgabe mit einer Spannung
            und einem Zielwert, setzt Widerstände auf die Plätze des Schaltbretts und baust Messgeräte ein. Bei jeder
            neuen Aufgabe ändern sich die Zahlen. Der Editor rechnet nach, was deine Schaltung anzeigt.

            "
          en: "Now you build circuits that reach certain values. You get a task with a voltage and a target value, put
            resistors on the places of the circuit board and build in meters. The numbers change with every new task.
            The builder calculates what your circuit shows.

            "
  - type: section
    id: merke
    title:
      de: Das merkst du dir
      en: What to remember
    blocks:
      - type: text
        text:
          de: "- Das Schaltbrett hat vier Plätze: Platz 1 und 4 liegen in der **Hauptleitung**, Platz 2 und 3 sind die
            beiden **Zweige** einer Parallelschaltung.

            - Ein **Amperemeter** baust du **in Reihe** ein: Es zeigt den Strom durch den Platz.

            - Ein **Voltmeter** schließt du **parallel** an: Es zeigt die Spannung am Platz.

            - Ein leerer Platz ist nur ein Draht. Ein Zweig ohne Widerstand überbrückt den anderen. Ohne Widerstand
            im ganzen Stromkreis gibt es einen **Kurzschluss**.

            "
          en: "- The circuit board has four places: places 1 and 4 are in the **main wire**, places 2 and 3 are the
            two **branches** of a parallel circuit.

            - You build an **ammeter** in **in series**: it shows the current through the place.

            - You connect a **voltmeter** **in parallel**: it shows the voltage across the place.

            - An empty place is just a wire. A branch without a resistor bypasses the other one. With no resistor in
            the whole circuit there is a **short circuit**.

            "
      - type: note
        title:
          de: Was der Editor vereinfacht
          en: What the builder simplifies
        blocks:
          - type: text
            text:
              de: "Die Quelle und die Messgeräte sind ideal: Sie haben selbst keinen Widerstand. Es fließt Gleichstrom.
                Auch eine Lampe hätte hier einen festen Widerstand, deshalb nimmst du Widerstände.

                "
              en: "The source and the meters are ideal: they have no resistance of their own. Direct current flows. A
                lamp would also have a fixed resistance here, which is why you use resistors.

                "
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Ein Strom von 0,4 A an 12 V
          en: A current of 0.4 A on 12 V
        blocks:
          - type: text
            text:
              de:
                'Die Quelle hat 12 V, das Amperemeter soll 0,4 A zeigen. Der Widerstand muss $R = \frac{U}{I} = \frac{12
                \text{ V}}{0{,}4 \text{ A}} = 30 \text{ Ω}$ sein. Setze einen Widerstand von 30 Ω auf Platz 1 und baue
                das Amperemeter dort ein. Es geht auch mit 10 Ω und 20 Ω in Reihe, denn $10 + 20 = 30$.

                '
              en:
                'The source has 12 V, the ammeter should show 0.4 A. The resistance must be $R = \frac{U}{I} = \frac{12
                \text{ V}}{0.4 \text{ A}} = 30 \text{ Ω}$. Put a resistor of 30 Ω on place 1 and build the ammeter in
                there. It also works with 10 Ω and 20 Ω in series, because $10 + 20 = 30$.

                '
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: vue-component
        component: SchaltungMessen
        props:
          kinds:
            - strom
            - spannung
            - parallel
          texts:
            battery:
              de: Quelle
              en: Source
            board:
              de: Schaltbrett mit vier Plätzen
              en: Circuit board with four places
            tools:
              de: Werkzeug wählen
              en: Choose a tool
            toolWire:
              de: Draht
              en: Wire
            toolResistor:
              de: "{n} Ω"
              en: "{n} Ω"
            toolAmmeter:
              de: Amperemeter
              en: Ammeter
            toolVoltmeter:
              de: Voltmeter
              en: Voltmeter
            hintWire:
              de: Tippe auf einen Platz, um den Widerstand zu entfernen. Ein leerer Platz ist nur ein Draht.
              en: Tap a place to remove the resistor. An empty place is just a wire.
            hintResistor:
              de: Tippe auf einen Platz, um einen Widerstand mit dem gewählten Wert einzusetzen.
              en: Tap a place to put in a resistor with the chosen value.
            hintAmmeter:
              de: Tippe auf einen Platz, um ein Amperemeter in Reihe einzubauen, oder noch einmal, um es zu entfernen.
              en: Tap a place to build an ammeter in series, or tap again to remove it.
            hintVoltmeter:
              de: Tippe auf einen Platz, um ein Voltmeter parallel anzuschließen, oder noch einmal, um es zu entfernen.
              en: Tap a place to connect a voltmeter in parallel, or tap again to remove it.
            slot:
