              en: Check
            next:
              de: Nächste Aufgabe
              en: Next task
            decimal:
              de: ","
              en: .
        nojs:
          de: "Diese Aufgaben stellt der Editor, jeweils mit neuen Zahlen. Das Schaltbrett hat vier Plätze: 1 und 4
            in der Hauptleitung, 2 und 3 als Zweige einer Parallelschaltung. Beispiele mit Lösung: - **Strom:** Quelle
            12 V, das Amperemeter in der Hauptleitung soll 0,4 A zeigen. Lösung: ein Widerstand von 30 Ω auf Platz 1,
            Amperemeter bei Platz 1. - **Spannung:** Quelle 12 V, ein Voltmeter an einem Widerstand soll 3 V zeigen.
            Lösung: 10 Ω auf Platz 1 und 30 Ω auf Platz 4, Voltmeter an Platz 1. - **Parallel:** Quelle 12 V, das Amperemeter
            in der Hauptleitung soll 1 A zeigen. Lösung: 20 Ω auf Platz 2 und 30 Ω auf Platz 3, Amperemeter bei Platz
            1."
          en: "These tasks are set by the builder, each time with new numbers. The circuit board has four places: 1
            and 4 in the main wire, 2 and 3 as branches of a parallel circuit. Examples with solutions: - **Current:**
            source 12 V, the ammeter in the main wire should show 0.4 A. Solution: a resistor of 30 Ω on place 1, ammeter
            at place 1. - **Voltage:** source 12 V, a voltmeter across a resistor should show 3 V. Solution: 10 Ω on
            place 1 and 30 Ω on place 4, voltmeter at place 1. - **Parallel:** source 12 V, the ammeter in the main
            wire should show 1 A. Solution: 20 Ω on place 2 and 30 Ω on place 3, ammeter at place 1."
      - type: single-choice
        id: be-kurzschluss
        text:
          de: Du setzt einen Widerstand in Platz 2 und lässt Platz 3 leer. Platz 1 und 4 sind leer. Was passiert?
          en: You put a resistor into place 2 and leave place 3 empty. Places 1 and 4 are empty. What happens?
        options:
          - text:
              de: "Es gibt einen Kurzschluss: Der leere Zweig ist nur ein Draht, und im Stromkreis liegt kein Widerstand."
              en: "There is a short circuit: the empty branch is just a wire, and there is no resistor in the circuit."
            correct: true
            info:
              de: Der Strom nimmt den Draht und umgeht den Widerstand. Der Stromkreis hat dann keinen Widerstand, der
                den Strom begrenzt.
              en: The current takes the wire and bypasses the resistor. The circuit then has no resistor to limit the
                current.
          - text:
              de: Der Strom fließt durch den Widerstand, das Amperemeter zeigt U geteilt durch R.
              en: The current flows through the resistor, the ammeter shows U divided by R.
            correct: false
            info:
              de: Der Strom nimmt den Weg ohne Widerstand, nicht den mit Widerstand.
              en: The current takes the path without a resistor, not the one with the resistor.
          - text:
              de: Es passiert nichts.
              en: Nothing happens.
            correct: false
            info:
              de: "Ein leerer Zweig verändert den Stromkreis stark: Er überbrückt den anderen Zweig."
              en: "An empty branch changes the circuit a lot: it bypasses the other branch."
        explanation:
          de:
            Ein Zweig ohne Widerstand überbrückt den anderen. Ohne Widerstand im ganzen Stromkreis ist es ein Kurzschluss,
            und der Strom wäre viel zu groß.
          en:
            A branch without a resistor bypasses the other. With no resistor in the whole circuit it is a short circuit,
            and the current would be far too large.
        links:
          - title:
              de: Ohmsches Gesetz (Wikipedia)
              en: Ohmsches Gesetz (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Ohmsches_Gesetz
