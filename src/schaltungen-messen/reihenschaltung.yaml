# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title:
  de: Reihenschaltung mit Messgeräten
  en: Series circuit with meters
description:
  de: In der Reihenschaltung ist die Stromstärke überall gleich, und die Spannungen der Widerstände addieren sich.
  en: In a series circuit the current is the same everywhere, and the voltages of the resistors add up.
blocks:
  - type: section
    id: idee
    title:
      de: Die Idee
      en: The idea
    blocks:
      - type: text
        text:
          de: "Zwei Widerstände hängen hintereinander an einer Batterie. Du misst an zwei Stellen die Stromstärke und
            an jedem Widerstand die Spannung. Was fällt dir auf? Die Stromstärke ist überall gleich, die Spannung teilt
            sich auf die Widerstände auf. Wie eine [Reihenschaltung](/schaltungen/reihenschaltung/) gebaut ist, weißt
            du schon, jetzt kommen die Größen dazu.

            "
          en:
            "Two resistors hang one behind the other on a battery. You measure the current at two places and the voltage
            across each resistor. What do you notice? The current is the same everywhere, the voltage is shared among
            the resistors. You already know how a [series circuit](/schaltungen/reihenschaltung/) is built; now the
            quantities come in.

            "
  - type: section
    id: merke
    title:
      de: Das merkst du dir
      en: What to remember
    blocks:
      - type: text
        text:
          de:
            "In einer Reihenschaltung gilt: - Die **Stromstärke** ist überall gleich: $I = I_1 = I_2$. - Die **Spannungen**
            addieren sich: $U = U_1 + U_2$. - Die **Widerstände** addieren sich: $R = R_1 + R_2$.

            "
          en: "In a series circuit: - The **current** is the same everywhere: $I = I_1 = I_2$. - The **voltages** add
            up: $U = U_1 + U_2$. - The **resistances** add up: $R = R_1 + R_2$.

            "
      - type: definition
        term:
          de: Gesamtwiderstand
          en: Total resistance
        explanation:
          de:
            Der Gesamtwiderstand ist der Widerstand, den die ganze Schaltung für die Quelle hat. In der Reihenschaltung
            ist er die Summe der einzelnen Widerstände.
          en: The total resistance is the resistance the whole circuit presents to the source. In a series circuit it
            is the sum of the single resistances.
      - type: formula
        formula: I = \frac{U}{R_1 + R_2}
      - type: figure
        image: images/reihe-messen.svg
        source: https://github.com/lernapps/elektrizitaet
        licence: CC0-1.0
        alt:
          de: Ein Rechteck aus Kabeln mit einer Batterie links, zwei Rechtecken für Widerstände oben und einem Kreis
            mit A rechts. Ein Kreis mit V ist am ersten Widerstand angeschlossen.
          en: A rectangle of wires with a battery on the left, two rectangles for resistors at the top and a circle
            with A on the right. A circle with V is connected across the first resistor.
        caption:
          de: "Zwei Widerstände in Reihe. Das Amperemeter sitzt im Kreis, das Voltmeter parallel zum ersten Widerstand.
            Beschriftung: 1 Batterie, 2 erster Widerstand, 3 zweiter Widerstand, 4 Amperemeter, 5 Voltmeter."
          en:
            "Two resistors in series. The ammeter sits in the circuit, the voltmeter in parallel with the first resistor.
            Labels: 1 battery, 2 first resistor, 3 second resistor, 4 ammeter, 5 voltmeter."
      - type: note
        title:
          de: Ein größerer Widerstand teilt mehr Spannung ab
          en: A larger resistor takes more voltage
        blocks:
          - type: text
            text:
              de: "Der größere Widerstand bekommt auch die größere Teilspannung. Die Stromstärke ist durch beide gleich.

                "
              en: "The larger resistor also gets the larger share of the voltage. The current through both is the same.

                "
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Zwei Widerstände an 12 V
          en: Two resistors on 12 V
        blocks:
          - type: text
            text:
              de: 'Ein Widerstand mit 10 Ω und einer mit 30 Ω liegen in Reihe an 12 V. Der Gesamtwiderstand ist $10 +
                30 = 40$ Ω. Die Stromstärke ist $I = \frac{12 \text{ V}}{40 \text{ Ω}} = 0{,}3$ A, überall im Kreis. Am
                10-Ω-Widerstand liegen $0{,}3 \cdot 10 = 3$ V, am 30-Ω-Widerstand $0{,}3 \cdot 30 = 9$ V. Zusammen sind
                das 12 V.

                '
              en: 'A resistor of 10 Ω and one of 30 Ω are connected in series on 12 V. The total resistance is $10 + 30
                = 40$ Ω. The current is $I = \frac{12 \text{ V}}{40 \text{ Ω}} = 0.3$ A, everywhere in the circuit. Across
                the 10 Ω resistor there are $0.3 \cdot 10 = 3$ V, across the 30 Ω resistor $0.3 \cdot 30 = 9$ V. Together
                that is 12 V.

                '
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: vue-component
        component: SchaltungVorhersage
        props:
          kinds:
            - reihe-strom
            - reihe-spannung
          texts:
            taskLabel:
              de: "Aufgabe:"
              en: "Task:"
            reset:
              de: Neu anfangen
              en: Start again
            check:
              de: Prüfen
              en: Check
            next:
              de: Nächste Aufgabe
              en: Next task
            decimal:
              de: ","
              en: .
            board:
              de: Stromkreis mit zwei Widerständen und einem Messgerät
              en: Circuit with two resistors and a meter
            prediction:
              de: Deine Vorhersage
              en: Your prediction
            "on":
              de: Der Stromkreis ist eingeschaltet.
              en: The circuit is switched on.
            "off":
              de: "Schreibe deine Vorhersage auf und prüfe sie: Dann wird eingeschaltet, und das Messgerät zeigt den
                Wert."
              en: "Write down your prediction and check it: then the circuit is switched on and the meter shows the
                value."
            right:
              de: Richtig! Das Messgerät zeigt {v}.
              en: Correct! The meter shows {v}.
            wrong:
              de: Nicht ganz. Das Messgerät zeigt {v}. Rechne noch einmal nach.
              en: Not quite. The meter shows {v}. Calculate again.
            taskReiheStrom:
              de: Zwei Widerstände von {R1} Ω und {R2} Ω liegen in Reihe an {U} V. Was zeigt das Amperemeter?
              en: Two resistors of {R1} Ω and {R2} Ω are connected in series on {U} V. What does the ammeter show?
            taskReiheSpannung:
              de: Zwei Widerstände von {R1} Ω und {R2} Ω liegen in Reihe an {U} V. Was zeigt das Voltmeter am zweiten
                Widerstand ({R2} Ω)?
              en: Two resistors of {R1} Ω and {R2} Ω are connected in series on {U} V. What does the voltmeter show
                across the second resistor ({R2} Ω)?
            taskParallelGesamt:
              de: Zwei Widerstände von {R1} Ω und {R2} Ω liegen parallel an {U} V. Was zeigt das Amperemeter in der
                Hauptleitung?
              en: Two resistors of {R1} Ω and {R2} Ω are connected in parallel on {U} V. What does the ammeter in the
                main wire show?
            taskParallelZweig:
              de: Zwei Widerstände von {R1} Ω und {R2} Ω liegen parallel an {U} V. Was zeigt das Amperemeter im Zweig
                mit dem zweiten Widerstand ({R2} Ω)?
              en: Two resistors of {R1} Ω and {R2} Ω are connected in parallel on {U} V. What does the ammeter show
                in the branch with the second resistor ({R2} Ω)?
        nojs:
          de: 'Diese Übung zeigt zwei Widerstände in Reihe an einer Batterie. Du sagst vorher, was das Messgerät zeigt,
            prüfst, und der Stromkreis schaltet sich ein. Beispiel: 12 V, 10 Ω und 30 Ω, Amperemeter. Lösung: $I = \frac{12
            \text{ V}}{10 + 30 \text{ Ω}} = 0{,}3 \text{ A}$. Am zweiten Widerstand zeigt ein Voltmeter $0{,}3 \cdot
            30 = 9$ V.'
          en: 'This exercise shows two resistors in series on a battery. You predict what the meter shows, check, and
            the circuit switches on. Example: 12 V, 10 Ω and 30 Ω, ammeter. Solution: $I = \frac{12 \text{ V}}{10 +
            30 \text{ Ω}} = 0.3 \text{ A}$. Across the second resistor a voltmeter shows $0.3 \cdot 30 = 9$ V.'
      - type: generated
        id: rr-strom
        given:
          U:
            oneOf:
              - 6
              - 9
              - 12
          R1:
            oneOf:
              - 10
              - 20
              - 30
              - 50
          R2:
            oneOf:
              - 10
              - 20
              - 30
              - 50
        where:
          - decimals(U / (R1 + R2)) <= 3
        task:
          text:
            de: Zwei Widerstände von {{R1}} Ω und {{R2}} Ω liegen in Reihe an {{U}} V. Wie groß ist die Stromstärke
              in Ampere?
            en: Two resistors of {{R1}} Ω and {{R2}} Ω are connected in series on {{U}} V. What is the current in amperes?
        answer:
          value: U / (R1 + R2)
          compare:
            number:
              format: decimal
              decimals: 3
              unit:
                de: A
                en: A
        mistakes:
          - value: U / R1
            message:
              de:
                "Du hast nur den ersten Widerstand genommen. In einer Reihenschaltung gehören beide Widerstände zusammen:
                $R = R_1 + R_2$."
              en: "You only used the first resistor. In a series circuit both resistors belong together: $R = R_1 + R_2$."
          - value: U / R1 + U / R2
            message:
              de: So rechnest du bei einer Parallelschaltung. In der Reihenschaltung gibt es nur einen Strom, er fließt
                durch beide Widerstände.
              en: That is how you calculate a parallel circuit. In a series circuit there is only one current, and it
                flows through both resistors.
        hint:
          de: Rechne erst den Gesamtwiderstand $R_1 + R_2$ aus.
          en: First calculate the total resistance $R_1 + R_2$.
        steps:
          - de: $R = R_1 + R_2 = {{R1}}\text{ Ω} + {{R2}}\text{ Ω}$
            en: $R = R_1 + R_2 = {{R1}}\text{ Ω} + {{R2}}\text{ Ω}$
          - de: $I = \frac{U}{R} = \frac{{{U}}\text{ V}}{{{R1}} + {{R2}}\text{ Ω}} = {{answer}}\text{ A}$
            en: $I = \frac{U}{R} = \frac{{{U}}\text{ V}}{{{R1}} + {{R2}}\text{ Ω}} = {{answer}}\text{ A}$
      - type: generated
        id: rr-teilspannung
        given:
          U:
            oneOf:
              - 6
              - 9
              - 12
          U1:
            oneOf:
              - 1
              - 2
              - 3
              - 4
        where:
          - U != 2 * U1
          - U > U1
        task:
          text:
            de: Zwei Widerstände liegen in Reihe an {{U}} V. Das Voltmeter am ersten Widerstand zeigt {{U1}} V. Wie
              groß ist die Spannung am zweiten Widerstand in Volt?
            en: Two resistors are connected in series on {{U}} V. The voltmeter at the first resistor shows {{U1}} V.
              What is the voltage across the second resistor in volts?
        answer:
          value: U - U1
          compare:
            number:
              format: integer
              unit:
                de: V
                en: V
        mistakes:
          - value: U1
            message:
              de: Das ist die Spannung am ersten Widerstand. Die Spannungen in der Reihenschaltung sind verschieden und
                ergeben zusammen die Gesamtspannung.
              en: That is the voltage across the first resistor. The voltages in a series circuit differ and add up to
                the total voltage.
          - value: U + U1
            message:
              de:
                Du hast addiert. Die Gesamtspannung ist die Summe der Teilspannungen, also ziehst du die bekannte Teilspannung
                ab.
              en: You added. The total voltage is the sum of the partial voltages, so you subtract the known partial voltage.
        hint:
          de: $U = U_1 + U_2$, also $U_2 = U - U_1$.
          en: $U = U_1 + U_2$, so $U_2 = U - U_1$.
        steps:
          - de: $U_2 = U - U_1 = {{U}}\text{ V} - {{U1}}\text{ V} = {{answer}}\text{ V}$
            en: $U_2 = U - U_1 = {{U}}\text{ V} - {{U1}}\text{ V} = {{answer}}\text{ V}$
      - type: single-choice
        id: rr-ampere
        text:
          de: In einer Reihenschaltung zeigt das Amperemeter vor dem ersten Widerstand 0,2 A. Was zeigt ein Amperemeter
            hinter dem zweiten Widerstand?
          en: In a series circuit the ammeter before the first resistor shows 0.2 A. What does an ammeter after the
            second resistor show?
        options:
          - text:
              de: 0,2 A
              en: 0.2 A
            correct: true
            info:
              de: In einer Reihenschaltung gibt es nur einen Strom, er ist überall gleich groß.
              en: In a series circuit there is only one current, and it is the same everywhere.
          - text:
              de: weniger als 0,2 A
              en: less than 0.2 A
            correct: false
            info:
              de: Der Strom wird in den Widerständen nicht verbraucht. Es kommt genauso viel an, wie hineinfließt.
              en: The current is not used up in the resistors. As much comes out as flows in.
          - text:
              de: 0,4 A
              en: 0.4 A
            correct: false
            info:
              de: Der Strom verdoppelt sich nicht. Hinter dem zweiten Widerstand fließt nicht mehr als davor.
              en: The current does not double. Behind the second resistor no more flows than before.
        explanation:
          de: In der Reihenschaltung ist die Stromstärke an jeder Stelle gleich.
          en: In a series circuit the current is the same at every place.
        links:
          - title:
              de: Reihenschaltung (Wikipedia)
              en: Reihenschaltung (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Reihenschaltung
