# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title: Schalter und Schaltzeichen
description: Ein Schalter öffnet und schließt den Stromkreis. Im Schaltplan zeichnest du Bauteile als Schaltzeichen.
blocks:
  - type: section
    id: idee
    title: Die Idee
    blocks:
      - type: text
        text: |
          Wer einen Stromkreis aufschreiben will, muss keine Kabel und Lampen malen. Es gibt für jedes Bauteil ein
          kurzes **Schaltzeichen**. So lesen Menschen auf der ganzen Welt denselben Plan.
  - type: section
    id: merke
    title: Das merkst du dir
    blocks:
      - type: definition
        term: Schalter
        explanation: Ein Schalter öffnet oder schließt den Stromkreis. Geschlossen fließt der Strom, offen fließt keiner.
      - type: definition
        term: Schaltplan
        explanation: Ein Schaltplan zeigt einen Stromkreis mit Schaltzeichen statt mit Zeichnungen der Bauteile.
      - type: figure
        image: images/schaltzeichen.svg
        source: Eigene Zeichnung für diese App
        licence: CC0-1.0
        alt: Vier Schaltzeichen untereinander. Batterie, zwei Striche, ein langer dünner und ein kurzer dicker. Lampe, ein Kreis mit Kreuz. Schalter offen, eine Linie mit einer Lücke, die schräg nach oben zeigt. Schalter geschlossen, eine durchgehende Linie.
        caption: Die wichtigsten Schaltzeichen. Beim offenen Schalter ist die Linie **unterbrochen**, beim geschlossenen durchgehend.
      - type: table
        caption: Schaltzeichen und Bauteile
        header: [Bauteil, So erkennst du das Schaltzeichen]
        rowHeaders: true
        rows:
          - [Batterie, "zwei Striche, ein langer dünner und ein kurzer dicker"]
          - [Lampe, ein Kreis mit einem Kreuz darin]
          - [Schalter offen, eine Linie mit Lücke; der Strom fließt nicht]
          - [Schalter geschlossen, eine durchgehende Linie; der Strom fließt]
  - type: section
    id: beispiel
    title: Beispiel
    blocks:
      - type: example
        title: Ein Schaltplan in Worten
        blocks:
          - type: text
            text: |
              Ein Schaltplan zeigt: Batterie, dann ein Schalter, dann eine Lampe, dann zurück zur Batterie. Ist das
              Schaltzeichen des Schalters durchgehend, ist der Schalter geschlossen und die Lampe leuchtet. Zeigt es
              eine Lücke, ist er offen, und die Lampe bleibt dunkel.
  - type: section
    id: uebung
    title: Übung
    blocks:
      - type: matching
        id: sz-zuordnen
        text: Ordne jedes Schaltzeichen dem Bauteil zu.
        pairs:
          - { left: ein Kreis mit einem Kreuz, right: Lampe }
          - { left: "zwei Striche, ein langer und ein kurzer dicker", right: Batterie }
          - { left: eine Linie mit Lücke, right: offener Schalter }
        explanation: Der Kreis mit Kreuz steht für die Lampe, die zwei Striche für die Batterie, und die Lücke in der Linie zeigt einen offenen Schalter.
        links:
          - title: Schaltzeichen (Wikipedia)
            url: https://de.wikipedia.org/wiki/Schaltzeichen
      - type: true-false
        id: sz-offen
        text: Ein Schalter, dessen Schaltzeichen eine Lücke hat, ist geschlossen.
        answer: false
        explanation: Die Lücke bedeutet, dass der Kreis dort unterbrochen ist. Der Schalter ist offen, und es fließt kein Strom.
        links:
          - title: Elektrischer Schalter (Wikipedia)
            url: https://de.wikipedia.org/wiki/Elektrischer_Schalter
      - type: single-choice
        id: sz-schalter
        text: Die Lampe in einem Stromkreis mit Schalter leuchtet. Was weißt du über den Schalter?
        options:
          - text: Er ist geschlossen.
            correct: true
            info: Nur wenn der Schalter geschlossen ist, ist der ganze Kreis geschlossen, und der Strom kann fließen.
          - text: Er ist offen.
            correct: false
            info: Bei offenem Schalter ist der Kreis unterbrochen, und die Lampe bleibt dunkel.
          - text: Das kann man nicht sagen.
            correct: false
            info: Doch. Leuchtet die Lampe, muss der Kreis überall geschlossen sein, auch am Schalter.
        explanation: Die Lampe leuchtet nur, wenn der Strom durch den Schalter fließen kann. Also muss er geschlossen sein.
        links:
          - title: Elektrischer Schalter (Wikipedia)
            url: https://de.wikipedia.org/wiki/Elektrischer_Schalter
