# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title:
  de: Schalter und Schaltzeichen
  en: Switches and circuit symbols
description:
  de: Ein Schalter öffnet und schließt den Stromkreis. Im Schaltplan zeichnest du Bauteile als Schaltzeichen.
  en: A switch opens and closes the circuit. In a circuit diagram you draw parts as circuit symbols.
blocks:
  - type: section
    id: idee
    title:
      de: Die Idee
      en: The idea
    blocks:
      - type: text
        text:
          de: "Wer einen Stromkreis aufschreiben will, muss keine Kabel und Lampen malen. Es gibt für jedes Bauteil
            ein

            kurzes **Schaltzeichen**. So lesen Menschen auf der ganzen Welt denselben Plan.

            "
          en: "If you want to write down a circuit, you do not have to draw cables and lamps. Every part has a short

            **circuit symbol**. That way people all over the world read the same diagram.

            "
  - type: section
    id: merke
    title:
      de: Das merkst du dir
      en: What to remember
    blocks:
      - type: definition
        term:
          de: Schalter
          en: Switch
        explanation:
          de: Ein Schalter öffnet oder schließt den Stromkreis. Geschlossen fließt der Strom, offen fließt keiner.
          en: A switch opens or closes the circuit. Closed, the current flows; open, none flows.
      - type: definition
        term:
          de: Schaltplan
          en: Circuit diagram
        explanation:
          de: Ein Schaltplan zeigt einen Stromkreis mit Schaltzeichen statt mit Zeichnungen der Bauteile.
          en: A circuit diagram shows a circuit with circuit symbols instead of drawings of the parts.
      - type: figure
        image: images/schaltzeichen.svg
        source: https://github.com/lernapps/elektrizitaet
        licence: CC0-1.0
        alt:
          de: Vier Schaltzeichen untereinander. Batterie, zwei Striche, ein langer dünner und ein kurzer dicker. Lampe,
            ein Kreis mit Kreuz. Schalter offen, eine Linie mit einer Lücke, die schräg nach oben zeigt. Schalter geschlossen,
            eine durchgehende Linie.
          en: Four circuit symbols one below the other. Battery, two bars, a long thin one and a short thick one. Lamp,
            a circle with a cross. Open switch, a line with a gap that slants upwards. Closed switch, an unbroken line.
        caption:
          de: "Die wichtigsten Schaltzeichen. Beim offenen Schalter ist die Linie **unterbrochen**, beim geschlossenen
            durchgehend. Beschriftung: 1 Batterie, 2 Lampe, 3 Schalter offen, 4 Schalter geschlossen."
          en: "The most important circuit symbols. With the open switch the line is **broken**; with the closed switch
            it is unbroken. Labels: 1 battery, 2 lamp, 3 open switch, 4 closed switch."
      - type: table
        caption:
          de: Schaltzeichen und Bauteile
          en: Circuit symbols and parts
        header:
          - de: Bauteil
            en: Part
          - de: So erkennst du das Schaltzeichen
            en: How to recognise the circuit symbol
        rowHeaders: true
        rows:
          - - de: Batterie
              en: Battery
            - de: zwei Striche, ein langer dünner und ein kurzer dicker
              en: two bars, a long thin one and a short thick one
          - - de: Lampe
              en: Lamp
            - de: ein Kreis mit einem Kreuz darin
              en: a circle with a cross inside
          - - de: Schalter offen
              en: Open switch
            - de: eine Linie mit Lücke; der Strom fließt nicht
              en: a line with a gap; the current does not flow
          - - de: Schalter geschlossen
              en: Closed switch
            - de: eine durchgehende Linie; der Strom fließt
              en: an unbroken line; the current flows
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Ein Schaltplan in Worten
          en: A circuit diagram in words
        blocks:
          - type: text
            text:
              de: "Ein Schaltplan zeigt: Batterie, dann ein Schalter, dann eine Lampe, dann zurück zur Batterie. Ist das

                Schaltzeichen des Schalters durchgehend, ist der Schalter geschlossen und die Lampe leuchtet. Zeigt es

                eine Lücke, ist er offen, und die Lampe bleibt dunkel.

                "
              en:
                "A circuit diagram shows: battery, then a switch, then a lamp, then back to the battery. If the circuit

                symbol of the switch is unbroken, the switch is closed and the lamp lights up. If it shows a gap, the

                switch is open and the lamp stays dark.

                "
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: matching
        id: sz-zuordnen
        text:
          de: Ordne jedes Schaltzeichen dem Bauteil zu.
          en: Match each circuit symbol with the part.
        pairs:
          - left:
              de: ein Kreis mit einem Kreuz
              en: a circle with a cross
            right:
              de: Lampe
              en: Lamp
          - left:
              de: zwei Striche, ein langer und ein kurzer dicker
              en: two bars, a long one and a short thick one
            right:
              de: Batterie
              en: Battery
          - left:
              de: eine Linie mit Lücke
              en: a line with a gap
            right:
              de: offener Schalter
              en: open switch
        explanation:
          de: Der Kreis mit Kreuz steht für die Lampe, die zwei Striche für die Batterie, und die Lücke in der Linie
            zeigt einen offenen Schalter.
          en: The circle with a cross stands for the lamp, the two bars for the battery, and the gap in the line shows
            an open switch.
        links:
          - title:
              de: Schaltzeichen (Wikipedia)
              en: Schaltzeichen (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Schaltzeichen
      - type: true-false
        id: sz-offen
        text:
          de: Ein Schalter, dessen Schaltzeichen eine Lücke hat, ist geschlossen.
          en: A switch whose circuit symbol has a gap is closed.
        answer: false
        explanation:
          de: Die Lücke bedeutet, dass der Kreis dort unterbrochen ist. Der Schalter ist offen, und es fließt kein Strom.
          en: The gap means that the circuit is broken there. The switch is open and no current flows.
        links:
          - title:
              de: Elektrischer Schalter (Wikipedia)
              en: Elektrischer Schalter (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Elektrischer_Schalter
      - type: single-choice
        id: sz-schalter
        text:
          de: Eine Lampe und ein Schalter liegen in Reihe in einem Stromkreis. Die Lampe leuchtet. Was weißt du über
            den Schalter?
          en: A lamp and a switch are in series in a circuit. The lamp is lit. What do you know about the switch?
        options:
          - text:
              de: Er ist geschlossen.
              en: It is closed.
            correct: true
            info:
              de: Nur wenn der Schalter geschlossen ist, ist der ganze Kreis geschlossen, und der Strom kann fließen.
              en: Only when the switch is closed is the whole circuit closed, so that the current can flow.
          - text:
              de: Er ist offen.
              en: It is open.
            correct: false
            info:
              de: Bei offenem Schalter ist der Kreis unterbrochen, und die Lampe bleibt dunkel.
              en: With an open switch the circuit is broken and the lamp stays dark.
          - text:
              de: Das kann man nicht sagen.
              en: You cannot tell.
            correct: false
            info:
              de: Doch. Leuchtet die Lampe, muss der Kreis überall geschlossen sein, auch am Schalter.
              en: Yes, you can. If the lamp is lit, the circuit must be closed everywhere, including at the switch.
        explanation:
          de: Die Lampe leuchtet nur, wenn der Strom durch den Schalter fließen kann. Also muss er geschlossen sein.
          en: The lamp only lights up when the current can flow through the switch. So it must be closed.
        links:
          - title:
              de: Elektrischer Schalter (Wikipedia)
              en: Elektrischer Schalter (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Elektrischer_Schalter
      - type: vue-component
        component: SchaltungBauen
        props:
          goals:
            - eine
            - schalter
          texts:
            battery:
              de: Batterie
              en: Battery
            board:
              de: "Schaltbrett mit sechs Plätzen: oben und unten die Hauptleitung, daneben zwei Zweige"
              en: "Circuit board with six places: the main wire at the top and bottom, and two branches beside it"
            tools:
              de: Bauteil wählen
              en: Choose a part
            toolWire:
              de: Kabel
              en: Wire
            toolLamp:
              de: Lampe
              en: Lamp
            toolSwitch:
              de: Schalter
              en: Switch
            slot:
              de: Platz
              en: Place
            slotEmpty:
              de: leer, nur Kabel
              en: empty, just a wire
            slotLamp:
              de: Lampe
              en: lamp
            slotLampOut:
              de: Lampe herausgeschraubt
              en: lamp unscrewed
            slotSwitchClosed:
              de: Schalter geschlossen
              en: switch closed
            slotSwitchOpen:
              de: Schalter offen
              en: switch open
            status:
              de: "Leuchtende Lampen: {n}"
              en: "Lamps shining: {n}"
            short:
              de: Kurzschluss! Ein Kabel ohne Lampe überbrückt die Lampen im anderen Zweig, und der Strom fließt an
                ihnen vorbei.
              en: Short circuit! A wire without a lamp bypasses the lamps in the other branch, and the current flows
                past them.
            taskLabel:
              de: "Aufgabe:"
              en: "Task:"
            reset:
              de: Neu anfangen
              en: Start again
            goalEine:
              de: Baue einen Stromkreis mit einer Lampe. Wenn du den Strom einschaltest, soll die Lampe leuchten.
              en: Build a circuit with one lamp. When you switch the power on, the lamp should shine.
            goalSchalter:
              de: Baue einen Stromkreis mit einer Lampe und einem Schalter. Mit dem Schalter sollst du die Lampe ein-
                und ausschalten können.
              en: Build a circuit with one lamp and one switch. You should be able to switch the lamp on and off with
                the switch.
            goalReihe:
              de:
                Baue einen Stromkreis mit zwei Lampen hintereinander, also in Reihe. Wenn du eine Lampe herausschraubst,
                soll auch die andere ausgehen.
              en: Build a circuit with two lamps one behind the other, that is, in series. When you unscrew one lamp,
                the other should go out too.
            goalParallel:
              de:
                Baue einen Stromkreis mit zwei Lampen in den beiden Zweigen, also parallel. Wenn du eine Lampe herausschraubst,
                soll die andere weiterleuchten.
              en: Build a circuit with two lamps in the two branches, that is, in parallel. When you unscrew one lamp,
                the other should keep shining.
            goalJeSchalter:
              de: Baue einen Stromkreis mit zwei Lampen in den beiden Zweigen. Jede Lampe soll einen eigenen Schalter
                haben, mit dem du nur sie ein- und ausschaltest.
              en: Build a circuit with two lamps in the two branches. Each lamp should have its own switch, with which
                you switch only that lamp on and off.
            goalHaupt:
              de:
                Baue einen Stromkreis mit zwei Lampen in den beiden Zweigen und einem Schalter, der beide Lampen gemeinsam
                ein- und ausschaltet.
              en: Build a circuit with two lamps in the two branches and one switch that switches both lamps on and
                off together.
            boardSimple:
              de: Schaltbrett mit zwei Plätzen in einem Stromkreis
              en: Circuit board with two places in one circuit
            hintOff:
              de: "So geht es: Wähle ein Bauteil und tippe auf einen Platz. Mit dem Schalter-Werkzeug klappst du einen
                eingebauten Schalter auf oder zu. Wenn du fertig bist, schalte den Strom ein."
              en: "How it works: choose a part and tap a place. With the switch tool you flip a switch that is already
                built in. When you are done, switch the power on."
            hintOn:
              de: Der Strom ist an. Tippe auf einen Schalter, um ihn zu öffnen oder zu schließen, oder auf eine Lampe,
                um sie herauszuschrauben. Zum Umbauen schaltest du den Strom wieder aus.
              en: The power is on. Tap a switch to open or close it, or a lamp to unscrew it. To rebuild, switch the
                power off again.
            powerOn:
              de: Strom einschalten
              en: Switch the power on
            powerOff:
              de: Strom ausschalten
              en: Switch the power off
            statusOff:
              de: Der Strom ist aus.
              en: The power is off.
            whyLamps:
              de: "Die Anzahl der Lampen stimmt noch nicht. Lies die Aufgabe noch einmal: Wie viele Lampen sollen es
                sein?"
              en: "The number of lamps is not right yet. Read the task again: how many lamps should there be?"
            whySwitches:
              de: "Die Anzahl der Schalter stimmt noch nicht. Lies die Aufgabe noch einmal: Wie viele Schalter sollen
                es sein?"
              en: "The number of switches is not right yet. Read the task again: how many switches should there be?"
            whyShort:
              de: "Es gibt einen Kurzschluss: Ein Weg ohne Lampe überbrückt die Lampen. Setze in jeden Zweig ein Bauteil."
              en: "There is a short circuit: a path without a lamp bypasses the lamps. Put a part into each branch."
            whyDark:
              de: Es leuchtet nicht alles, was leuchten soll. Ist ein Schalter offen oder eine Lampe herausgeschraubt?
              en: Not everything that should shine does. Is a switch open or a lamp unscrewed?
            whyBehaviour:
              de:
                "Die Bauteile sind da, aber die Schaltung verhält sich noch nicht wie verlangt. Teste sie bei eingeschaltetem
                Strom: Schraube eine Lampe heraus und lege Schalter um."
              en: "The parts are there, but the circuit does not behave as asked yet. Test it with the power on: unscrew
                a lamp and flip the switches."
