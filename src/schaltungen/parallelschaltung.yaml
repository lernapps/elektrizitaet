# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title:
  de: Parallelschaltung
  en: Parallel circuit
description:
  de: Bei der Parallelschaltung hat jede Lampe ihren eigenen Weg. Fällt eine aus, leuchten die anderen weiter.
  en: In a parallel circuit every lamp has its own path. If one fails, the others keep shining.
blocks:
  - type: section
    id: idee
    title:
      de: Die Idee
      en: The idea
    blocks:
      - type: text
        text:
          de: "In deinem Zimmer kannst du das Licht ausschalten, ohne dass der Kühlschrank in der Küche ausgeht. Das
            geht,

            weil die Geräte im Haus **parallel** geschaltet sind: Jedes hat seinen eigenen Weg zur Stromquelle.

            "
          en: "In your room you can switch off the light without the fridge in the kitchen going off. That works because

            the devices in a house are connected **in parallel**: each has its own path to the power source.

            "
  - type: section
    id: merke
    title:
      de: Das merkst du dir
      en: What to remember
    blocks:
      - type: definition
        term:
          de: Parallelschaltung
          en: Parallel circuit
        explanation:
          de: Bei einer Parallelschaltung sind die Bauteile nebeneinander geschaltet. Der Strom hat mehrere Wege, einen
            für jedes Bauteil.
          en: In a parallel circuit the parts are connected next to each other. The current has several paths, one for
            each part.
      - type: figure
        image: images/parallelschaltung.svg
        source: https://github.com/lernapps/elektrizitaet
        licence: CC0-1.0
        alt:
          de:
            Ein Stromkreis mit einer Batterie und zwei Lampen, die nebeneinander an derselben oberen und unteren Leitung
            hängen. Jede Lampe hat ihren eigenen Weg.
          en: A circuit with a battery and two lamps that hang next to each other on the same top and bottom wire. Each
            lamp has its own path.
        caption:
          de: "Der Strom teilt sich auf. Jede Lampe liegt auf **ihrem eigenen Weg**. Beschriftung: 1 Batterie, 2 Lampe
            1, 3 Lampe 2."
          en: "The current splits up. Each lamp is on **its own path**. Labels: 1 battery, 2 lamp 1, 3 lamp 2."
      - type: text
        text:
          de: "Daraus folgt:

            - Wird **eine** Lampe herausgeschraubt, leuchten die **anderen weiter**.

            - Mit einem Schalter in jedem Zweig schaltest du jede Lampe **einzeln**.

            - Ein Schalter in der gemeinsamen Leitung schaltet **alle** zusammen.

            - Jede Lampe leuchtet gleich hell, auch wenn du eine dazuschaltest.

            "
          en: "It follows that:

            - If **one** lamp is unscrewed, the **others keep shining**.

            - With a switch in each branch you switch each lamp **on its own**.

            - A switch in the shared wire switches **all** of them together.

            - Every lamp shines equally brightly, even if you add another.

            "
      - type: note
        title:
          de: Vorsicht, Kurzschluss
          en: Careful, short circuit
        blocks:
          - type: definition
            term:
              de: Kurzschluss
              en: Short circuit
            explanation:
              de: Bei einem Kurzschluss fließt der Strom über einen Weg ganz ohne Verbraucher. Das Kabel kann sehr heiß
                werden, deshalb ist ein Kurzschluss gefährlich.
              en: In a short circuit the current flows along a path with no load at all. The cable can get very hot, so
                a short circuit is dangerous.
          - type: text
            text:
              de: Verbindest du die beiden Pole der Batterie direkt mit einem Kabel, gibt es einen Kurzschluss.
              en: If you connect the two poles of the battery directly with a wire, you get a short circuit.
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Das Licht im Haus
          en: The lights in a house
        blocks:
          - type: text
            text:
              de: "Alle Lampen und Steckdosen im Haus sind parallel geschaltet. Fällt eine Lampe aus, leuchten die

                anderen weiter, und jede Lampe hat ihren eigenen Schalter.

                "
              en: "All the lamps and sockets in a house are connected in parallel. If one lamp fails, the others keep

                shining, and every lamp has its own switch.

                "
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: single-choice
        id: ps-ausfall
        text:
          de: Zwei Lampen sind parallel geschaltet. Eine wird herausgeschraubt. Was passiert mit der anderen?
          en: Two lamps are connected in parallel. One is unscrewed. What happens to the other?
        options:
          - text:
              de: Sie leuchtet weiter.
              en: It keeps shining.
            correct: true
            info:
              de: Jede Lampe hat ihren eigenen Weg, und der Kreis der anderen Lampe bleibt geschlossen.
              en: Each lamp has its own path, and the circuit of the other lamp stays closed.
          - text:
              de: Sie geht auch aus.
              en: It goes out too.
            correct: false
            info:
              de: Das passiert in der Reihenschaltung, wo es nur einen Weg gibt.
              en: That happens in a series circuit, where there is only one path.
          - text:
              de: Sie leuchtet doppelt so hell.
              en: It shines twice as brightly.
            correct: false
            info:
              de: Die Helligkeit bleibt gleich. Jede Lampe bekommt weiter denselben Strom.
              en: The brightness stays the same. Each lamp still gets the same current.
        explanation:
          de: In der Parallelschaltung hat jede Lampe einen eigenen Weg. Fällt eine aus, bleibt der Weg der anderen
            geschlossen.
          en: In a parallel circuit each lamp has its own path. If one fails, the path of the other stays closed.
        links:
          - title:
              de: Parallelschaltung (Wikipedia)
              en: Parallelschaltung (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Parallelschaltung
      - type: matching
        id: ps-zuordnen
        text:
          de: Ordne jede Beobachtung der passenden Schaltung zu.
          en: Match each observation with the right circuit.
        pairs:
          - left:
              de: Eine Lampe wird herausgedreht, alle gehen aus
              en: One lamp is unscrewed, all go out
            right:
              de: Reihenschaltung
              en: Series circuit
          - left:
              de: Eine Lampe wird herausgedreht, die anderen leuchten weiter
              en: One lamp is unscrewed, the others keep shining
            right:
              de: Parallelschaltung
              en: Parallel circuit
        explanation:
          de: Gehen alle Lampen aus, gibt es nur einen Weg, also eine Reihenschaltung. Leuchten die anderen weiter,
            hat jede Lampe einen eigenen Weg, also eine Parallelschaltung.
          en: If all lamps go out, there is only one path, so it is a series circuit. If the others keep shining, each
            lamp has its own path, so it is a parallel circuit.
        links:
          - title:
              de: Parallelschaltung (Wikipedia)
              en: Parallelschaltung (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Parallelschaltung
      - type: true-false
        id: ps-haus
        text:
          de: Die Lampen in einem Haus sind parallel geschaltet.
          en: The lamps in a house are connected in parallel.
        answer: true
        explanation:
          de:
            Weil die Lampen und Geräte parallel liegen, funktionieren sie unabhängig voneinander. Du kannst jede einzeln
            ausschalten.
          en: Because the lamps and devices are in parallel, they work independently of each other. You can switch each
            one off on its own.
        links:
          - title:
              de: Parallelschaltung (Wikipedia)
              en: Parallelschaltung (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Parallelschaltung
      - type: vue-component
        component: SchaltungBauen
        props:
          goals:
            - parallel
            - je-schalter
            - haupt
          texts:
            battery:
              de: Batterie
              en: Battery
            board:
              de: Schaltbrett mit sechs Plätzen
              en: Circuit board with six places
            tools:
              de: Bauteil wählen
              en: Choose a part
            toolWire:
              de: Kabel
              en: Wire
            toolLamp:
              de: Lampe
              en: Lamp
            toolSwitch:
              de: Schalter
              en: Switch
            modes:
              de: Betriebsart
              en: Mode
            modeBuild:
              de: Bauen
              en: Build
            modeTest:
              de: Testen
              en: Test
            hintBuild:
              de: Wähle ein Bauteil und tippe auf einen Platz im Schaltbrett. Mit Kabel machst du einen Platz wieder
                leer.
              en: Choose a part and tap a place on the circuit board. With the wire you make a place empty again.
            hintTest:
              de:
                Tippe auf einen Schalter, um ihn zu öffnen oder zu schließen, und auf eine Lampe, um sie herauszuschrauben
                oder wieder einzuschrauben.
              en: Tap a switch to open or close it, and tap a lamp to unscrew it or screw it back in.
            slot:
              de: Platz
              en: Place
            slotEmpty:
              de: leer, nur Kabel
              en: empty, just a wire
            slotLamp:
              de: Lampe
              en: lamp
            slotLampOut:
              de: Lampe herausgeschraubt
              en: lamp unscrewed
            slotSwitchClosed:
              de: Schalter geschlossen
              en: switch closed
            slotSwitchOpen:
              de: Schalter offen
              en: switch open
            status:
              de: "Leuchtende Lampen: {n}"
              en: "Lamps shining: {n}"
            short:
              de: Kurzschluss! Ein Kabel ohne Lampe überbrückt die Lampen im anderen Zweig, und der Strom fließt an
                ihnen vorbei.
              en: Short circuit! A wire without a lamp bypasses the lamps in the other branch, and the current flows
                past them.
            taskLabel:
              de: "Aufgabe:"
              en: "Task:"
            reset:
              de: Neu anfangen
              en: Start again
            check:
              de: Prüfen
              en: Check
            next:
              de: Nächste Aufgabe
              en: Next task
            goalEine:
              de: Baue einen Stromkreis, in dem eine Lampe leuchtet.
              en: Build a circuit in which one lamp shines.
            goalSchalter:
              de: Baue einen Stromkreis, in dem du eine Lampe mit einem Schalter ein- und ausschaltest.
              en: Build a circuit in which you switch a lamp on and off with a switch.
            goalReihe:
              de: Baue einen Stromkreis mit zwei Lampen in Reihe. Wird eine herausgeschraubt, geht auch die andere aus.
              en: Build a circuit with two lamps in series. If one is unscrewed, the other goes out too.
            goalParallel:
              de: Baue einen Stromkreis mit zwei Lampen parallel. Wird eine herausgeschraubt, leuchtet die andere weiter.
              en: Build a circuit with two lamps in parallel. If one is unscrewed, the other keeps shining.
            goalJeSchalter:
              de: Baue einen Stromkreis mit zwei Lampen, die du mit je einem eigenen Schalter einzeln ein- und ausschaltest.
              en: Build a circuit with two lamps that you switch on and off separately, each with its own switch.
            goalHaupt:
              de: Baue einen Stromkreis mit zwei parallelen Lampen und einem Schalter, der beide gemeinsam ein- und
                ausschaltet.
              en: Build a circuit with two parallel lamps and one switch that switches both on and off together.
        nojs:
          de: "Diese Aufgaben stellt die Übung, jeweils mit ihrer Lösung. Das Schaltbrett hat sechs Plätze: 1 und
            6 in der Hauptleitung, 2 bis 5 in zwei Zweigen. - **Zwei Lampen parallel:** eine Lampe in jedem Zweig, zum
            Beispiel auf Platz 2 und 4. - **Zwei Lampen mit je einem Schalter:** In jedem Zweig ein Schalter und eine
            Lampe. - **Ein Schalter für zwei parallele Lampen:** Schalter auf Platz 1, Lampe in jedem Zweig."
          en: "These are the tasks the exercise sets, each with its solution. The circuit board has six places:
            1 and 6 in the main wire, 2 to 5 in two branches. - **Two lamps in parallel:** a lamp in each branch, for
            example on places 2 and 4. - **Two lamps, each with its own switch:** a switch and a lamp in each branch.
            - **One switch for two parallel lamps:** a switch on place 1, a lamp in each branch."
      - type: single-choice
        id: be-kurzschluss
        text:
          de: Du setzt eine Lampe in den linken senkrechten Zweig und lässt den rechten Zweig leer, also ohne Lampe.
            Was passiert?
          en: You put a lamp into the left vertical branch and leave the right branch empty, that is, without a lamp.
            What happens?
        options:
          - text:
              de: Es gibt einen Kurzschluss, und die Lampen leuchten nicht.
              en: There is a short circuit, and the lamp does not shine.
            correct: true
            info:
              de: Der leere Zweig ist ein Weg für den Strom ganz ohne Lampe. Der Strom nimmt diesen Weg und lässt die
                Lampen aus.
              en: The empty branch is a path for the current with no lamp at all. The current takes this path and leaves
                the lamp off.
          - text:
              de: Die Lampen leuchten heller.
              en: The lamp shines more brightly.
            correct: false
            info:
              de: Die Lampen bekommen dann sogar keinen Strom mehr, weil der Strom den leeren Zweig nimmt.
              en: The lamp then gets no current at all, because the current takes the empty branch.
          - text:
              de: Es passiert nichts.
              en: Nothing happens.
            correct: false
            info:
              de: Ein leerer Zweig verändert den Stromkreis deutlich. Es ist ein Kurzschluss.
              en: An empty branch changes the circuit a lot. It is a short circuit.
        explanation:
          de: Ein Zweig ohne Verbraucher ist ein Kurzschluss. Der Strom fließt am ganzen Verbraucher vorbei, und das
            kann Kabel gefährlich heiß machen.
          en: A branch without a load is a short circuit. The current flows past every load, and that can make cables
            dangerously hot.
        links:
          - title:
              de: Kurzschluss (Wikipedia)
              en: Kurzschluss (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Kurzschluss
