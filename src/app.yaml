title:
  de: Elektrizität
  en: Electricity
intro:
  de: |
    Wie funktioniert ein Stromkreis? Warum leitet Kupfer den Strom und Gummi nicht? Was ist der Unterschied zwischen
    Reihen- und Parallelschaltung? Hier erklärst du dir die Grundlagen der Elektrizität Schritt für Schritt und übst auf
    jeder Seite. Am Ende baust du selbst Schaltungen im Bau-Editor. Für die Klassen 5 und 6; später kommen höhere
    Klassen dazu.
  en: |
    How does an electric circuit work? Why does copper conduct electricity and rubber does not? What is the difference
    between series and parallel circuits? Here you work out the basics of electricity step by step and practise on every
    page. At the end you build circuits yourself in the circuit builder. For grades 5 and 6; higher grades will follow.
languages:
