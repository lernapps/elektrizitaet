title:
  de: Elektrizität
  en: Electricity
intro:
  de: |
    Wie funktioniert ein Stromkreis? Warum leitet Kupfer den Strom und Gummi nicht? Was ist der Unterschied zwischen
    Reihen- und Parallelschaltung? Und wie hängen Stromstärke, Spannung und Widerstand zusammen? Hier erklärst du dir die
    Grundlagen der Elektrizität Schritt für Schritt und übst auf jeder Seite. In den Übungen baust du selbst
    Schaltungen. Für die Klassen 5 bis 8: erst der Stromkreis, dann die Größen mit dem ohmschen Gesetz. Es geht um
    Gleichstrom, wie ihn Batterien liefern; Wechselstrom kommt später.
  en: |
    How does an electric circuit work? Why does copper conduct electricity and rubber does not? What is the difference
    between series and parallel circuits? And how are current, voltage and resistance related? Here you work out the basics
    of electricity step by step and practise on every page. In the exercises you build circuits yourself. For grades
    5 to 8: first the circuit, then the quantities with Ohm's law. It is about direct current, as batteries supply it;
    alternating current comes later.
