            hint:
              de: "So geht es: Tippe auf eine Stelle, um das Amperemeter dort einzubauen. Noch einmal tippen nimmt es
                wieder heraus. Wähle den Widerstand. Dann schalte den Strom ein und lies das Amperemeter ab."
              en:
                "How it works: tap a place to build the ammeter in there. Tapping again takes it out. Choose the resistor.
                Then switch the power on and read the ammeter."
            short:
              de: Kurzschluss! Das Amperemeter überbrückt die Batterie, und es fließt viel zu viel Strom.
              en: Short circuit! The ammeter bridges the battery, and far too much current flows.
            ammeter:
              de: Das Amperemeter zeigt {v}.
              en: The ammeter shows {v}.
            noAmmeter:
              de: Noch kein Amperemeter eingebaut.
              en: No ammeter built in yet.
            task:
              de: Die Batterie hat {U} V. Baue das Amperemeter richtig ein und wähle den Widerstand so, dass es {T}
                A zeigt.
              en: The battery has {U} V. Build the ammeter in correctly and choose the resistor so that it shows {T}
                A.
