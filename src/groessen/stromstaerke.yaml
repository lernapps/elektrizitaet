      - type: single-choice
        id: sa-einbau
        text:
          de: Wie schließt du ein Amperemeter an, um die Stromstärke durch eine Lampe zu messen?
          en: How do you connect an ammeter to measure the current through a lamp?
        options:
          - text:
              de: Du baust es in den Stromkreis ein, in Reihe mit der Lampe.
              en: You put it into the circuit, in series with the lamp.
            correct: true
            info:
              de: Nur wenn der ganze Strom durch das Gerät fließt, kann es ihn messen.
              en: Only when all the current flows through the device can it measure it.
          - text:
              de: Du hältst es parallel an die Lampe.
              en: You connect it in parallel with the lamp.
            correct: false
            info:
              de: "Parallel angeschlossen überbrückt das Amperemeter die Lampe: Es entsteht ein Kurzschluss."
              en: "Connected in parallel, the ammeter bypasses the lamp: that makes a short circuit."
          - text:
              de: Du hältst es nur an die Batterie.
              en: You only hold it against the battery.
            correct: false
            info:
              de: Ein Amperemeter misst nur, was durch es hindurchfließt. An der Batterie allein fließt nichts durch das
                Gerät.
              en: An ammeter only measures what flows through it. Held against the battery alone, nothing flows through
                the device.
        explanation:
          de: Das Amperemeter muss im Stromkreis liegen, damit der Strom hindurchfließt.
          en: The ammeter must be in the circuit so that the current flows through it.
        links:
          - title:
              de: Elektrische Stromstärke (Wikipedia)
              en: Elektrische Stromstärke (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Elektrische_Stromst%C3%A4rke
      - type: true-false
        id: sa-umrechnen
        text:
          de: Ein Amperemeter zeigt 0,5 A. Das sind 500 mA.
          en: An ammeter shows 0.5 A. That is 500 mA.
        answer: true
        explanation:
          de: 1 A sind 1000 mA, also sind 0,5 A genau 500 mA.
          en: 1 A is 1000 mA, so 0.5 A is exactly 500 mA.
        links:
          - title:
              de: Elektrische Stromstärke (Wikipedia)
              en: Elektrische Stromstärke (German Wikipedia)
            url: https://de.wikipedia.org/wiki/Elektrische_Stromst%C3%A4rke
      - type: generated
        id: sa-rechnen
        given:
          mA:
            oneOf:
              - 100
              - 200
              - 250
              - 300
              - 400
              - 500
              - 750
              - 800
        task:
          text:
            de: Ein Gerät braucht {{mA}} mA. Wie groß ist die Stromstärke in Ampere?
            en: A device needs {{mA}} mA. What is the current in amperes?
        answer:
          value: mA / 1000
          compare:
            number:
              format: decimal
              decimals: 2
              unit:
                de: A
                en: A
        mistakes:
          - value: mA / 100
            message:
              de: Du hast durch 100 geteilt. 1 A sind 1000 mA, du musst durch 1000 teilen.
              en: You divided by 100. 1 A is 1000 mA, so you divide by 1000.
          - value: mA * 1000
            message:
              de: Du hast in die falsche Richtung umgerechnet. Ampere ist die größere Einheit, die Zahl wird kleiner.
              en: You converted the wrong way. The ampere is the larger unit, so the number gets smaller.
        hint:
          de: 1 A sind 1000 mA. Teile die Zahl durch 1000.
          en: 1 A is 1000 mA. Divide the number by 1000.
        steps:
          - de: $I = \frac{{{mA}}\text{ mA}}{1000}$
            en: $I = \frac{{{mA}}\text{ mA}}{1000}$
          - de: "{{mA}} mA sind {{answer}} A."
            en: "{{mA}} mA is {{answer}} A."
