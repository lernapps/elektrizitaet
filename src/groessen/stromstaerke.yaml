# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title:
  de: Die Stromstärke
  en: Current
description:
  de: Die Stromstärke sagt, wie viel Strom fließt. Du misst sie mit dem Amperemeter, in Ampere (A) und Milliampere
    (mA).
  en: The current tells you how much electric current flows. You measure it with an ammeter, in amperes (A) and
    milliamperes (mA).
blocks:
  - type: section
    id: idee
    title:
      de: Die Idee
      en: The idea
    blocks:
      - type: text
        text:
          de: "Ein kleines Lämpchen und ein Föhn hängen beide am Strom, doch der Föhn braucht viel mehr davon. Wie viel
            Strom fließt, sagt die **Stromstärke**. Stell dir den Stromkreis wie einen Wasserkreislauf vor: Die Stromstärke
            ist wie die Wassermenge, die in jeder Sekunde an einer Stelle vorbeiströmt. Das Bild hilft, hat aber Grenzen:
            Strom ist kein Wasser, und Kabel sind nicht hohl.

            "
          en: "A small lamp and a hairdryer both run on electricity, but the hairdryer needs much more of it. How much
            current flows is told by the **current** (in German: *Stromstärke*). Think of the circuit as a water cycle:
            the current is like the amount of water that flows past one place every second. The picture helps, but it
            has limits: electricity is not water, and wires are not hollow.

            "
  - type: section
    id: merke
    title:
      de: Das merkst du dir
      en: What to remember
    blocks:
      - type: definition
        term:
          de: Stromstärke
          en: Current
        explanation:
          de: Die Stromstärke gibt an, wie viel elektrischer Strom in einem Stromkreis fließt. Sie hat das Formelzeichen
            $I$ und wird in Ampere (A) gemessen.
          en: The current says how much electric current flows in a circuit. Its symbol is $I$ and it is measured in
            amperes (A).
      - type: definition
        term:
          de: Amperemeter
          en: Ammeter
        explanation:
          de: Ein Amperemeter misst die Stromstärke. Du baust es **in den Stromkreis ein**, sodass der Strom durch das
            Gerät fließt.
          en: An ammeter measures the current. You put it **into the circuit** so that the current flows through the
            device.
      - type: formula
        formula: 1 \text{ A} = 1000 \text{ mA}
      - type: text
        text:
          de: "Typische Werte: ein Taschenlampenlämpchen braucht etwa 200 mA, also 0,2 A. Ein Föhn braucht etwa 9 A.

            "
          en: "Typical values: a torch bulb needs about 200 mA, that is 0.2 A. A hairdryer needs about 9 A.

            "
      - type: figure
        image: images/amperemeter.svg
        source: https://github.com/lernapps/elektrizitaet
        licence: CC0-1.0
        alt:
          de: Ein Rechteck aus Kabeln mit einer Batterie links, einer Lampe oben und einem Kreis mit dem Buchstaben
            A rechts. Der Kreis sitzt mitten im Kabel.
          en: A rectangle of wires with a battery on the left, a lamp at the top and a circle with the letter A on the
            right. The circle sits in the middle of the wire.
        caption:
          de: "Das Amperemeter sitzt **im** Stromkreis, in Reihe mit der Lampe: Der ganze Strom fließt durch das Gerät.
            Beschriftung: 1 Batterie, 2 Lampe, 3 Amperemeter."
          en: "The ammeter sits **in** the circuit, in series with the lamp: all the current flows through the device.
            Labels: 1 battery, 2 lamp, 3 ammeter."
      - type: note
        title:
          de: Nie parallel
          en: Never in parallel
        blocks:
          - type: text
            text:
              de: "Ein Amperemeter lässt den Strom fast ungehindert durch. Schließt du es **parallel** an, etwa direkt
                an die Batterie, entsteht ein Kurzschluss: Es fließt viel zu viel Strom.

                "
              en: "An ammeter lets the current through almost without hindrance. If you connect it in **parallel**, for
                example straight across the battery, you create a short circuit: far too much current flows.

                "
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Das Lämpchen messen
          en: Measuring the bulb
        blocks:
          - type: text
            text:
              de:
                "Das Amperemeter zeigt 0,25 A. Das sind 0,25 · 1000 = 250 mA. Ein Lämpchen mit 250 mA braucht also etwas
                mehr Strom als das Taschenlampenlämpchen von oben.

                "
              en:
                "The ammeter shows 0.25 A. That is 0.25 · 1000 = 250 mA. So a bulb with 250 mA needs a little more current
                than the torch bulb above.

                "
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: vue-component
        component: StromMessen
        props:
          texts:
            taskLabel:
              de: "Aufgabe:"
              en: "Task:"
            reset:
              de: Neu anfangen
              en: Start again
            check:
              de: Prüfen
              en: Check
            decimal:
              de: ","
              en: .
            switchOn:
              de: Strom einschalten
              en: Switch the power on
            switchOff:
              de: Strom ausschalten
              en: Switch the power off
            "off":
              de: Der Strom ist aus. Schalte ihn ein oder prüfe, dann wird gemessen.
              en: The power is off. Switch it on or check, then it measures.
            whyAmmeter:
              de: Es ist noch kein Amperemeter eingebaut.
              en: No ammeter is built in yet.
            whyShort:
              de: "Das Amperemeter liegt quer über der Batterie: Das ist ein Kurzschluss, und es fließt kein Strom durch
                das Gerät."
              en: "The ammeter is straight across the battery: that is a short circuit, and no current flows through
                the device."
            whyValue:
              de: Das Amperemeter zeigt {v}, verlangt sind {T} A. Der Strom ist die Spannung geteilt durch den Widerstand.
              en: The ammeter shows {v}, but {T} A are asked. The current is the voltage divided by the resistance.
            resistor:
              de: "{n} Ω"
              en: "{n} Ω"
            board:
              de: Stromkreis mit Batterie und Widerstand und drei Stellen für das Amperemeter
              en: Circuit with battery and resistor and three places for the ammeter
            resistors:
              de: Widerstand wählen
              en: Choose the resistor
            spot:
              de: Stelle
              en: Place
            spotA:
              de: in der oberen Leitung
              en: in the top wire
            spotB:
              de: in der unteren Leitung
              en: in the bottom wire
            spotPar:
              de: quer über der Batterie
              en: straight across the battery
            spotFree:
              de: frei
