# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v1.schema.json
title:
  de: Das ohmsche Gesetz
  en: Ohm's law
description:
  de: "Spannung, Stromstärke und Widerstand hängen zusammen: R = U / I. Damit berechnest du eine fehlende Größe."
  en: "Voltage, current and resistance are linked: R = U / I. With it you calculate a missing quantity."
blocks:
  - type: section
    id: idee
    title:
      de: Die Idee
      en: The idea
    blocks:
      - type: text
        text:
          de: "Du schließt einen Widerstand an eine Batterie an und misst. Mit doppelter Spannung fließt auch doppelt
            so viel Strom. Das Verhältnis aus Spannung und Stromstärke bleibt gleich: Es ist der Widerstand. Dieser
            Zusammenhang ist das **ohmsche Gesetz**.

            "
          en: "You connect a resistor to a battery and measure. With twice the voltage, twice as much current flows.
            The ratio of voltage to current stays the same: it is the resistance. This relation is **Ohm's law**.

            "
  - type: section
    id: merke
    title:
      de: Das merkst du dir
      en: What to remember
    blocks:
      - type: definition
        term:
          de: Ohmsches Gesetz
          en: Ohm's law
        explanation:
          de:
            'Bei einem ohmschen Widerstand ist die Spannung geteilt durch die Stromstärke immer gleich: $R = \frac{U}{I}$.
            Der Widerstand ändert sich nicht, wenn man die Spannung ändert.'
          en:
            'For an ohmic resistor the voltage divided by the current is always the same: $R = \frac{U}{I}$. The resistance
            does not change when you change the voltage.'
      - type: formula
        formula: R = \frac{U}{I}
      - type: formula
        formula: U = R \cdot I
      - type: formula
        formula: I = \frac{U}{R}
      - type: text
        text:
          de: "Die Einheit: 1 Ω = 1 V : 1 A. Rechne die Stromstärke vorher in Ampere um, nicht in Milliampere.

            "
          en: "The unit: 1 Ω = 1 V : 1 A. Convert the current to amperes first, not milliamperes.

            "
      - type: definition
        term:
          de: Kennlinie
          en: Characteristic curve
        explanation:
          de: Eine Kennlinie zeigt, wie die Stromstärke von der Spannung abhängt. Bei einem ohmschen Widerstand ist
            sie eine Gerade durch den Nullpunkt.
          en:
            A characteristic curve shows how the current depends on the voltage. For an ohmic resistor it is a straight
            line through the origin.
      - type: figure
        image: images/kennlinie.svg
        source: https://github.com/lernapps/elektrizitaet
        licence: CC0-1.0
        alt:
          de: "Ein Koordinatensystem mit der Spannung U nach rechts und der Stromstärke I nach oben. Eine Gerade geht
            vom Nullpunkt schräg nach oben. Zwei Punkte sind markiert: bei U gleich 1 ist I gleich 1, bei U gleich 2
            ist I gleich 2."
          en: "A coordinate system with the voltage U to the right and the current I upward. A straight line rises from
            the origin. Two points are marked: at U equal to 1, I is 1, and at U equal to 2, I is 2."
        caption:
          de: "Die Kennlinie eines ohmschen Widerstands ist eine Gerade durch den Nullpunkt: Doppelte Spannung ergibt
            doppelte Stromstärke. Die Ziffern 1 und 2 stehen für gleiche Schritte auf beiden Achsen."
          en: "The characteristic curve of an ohmic resistor is a straight line through the origin: twice the voltage
            gives twice the current. The digits 1 and 2 stand for equal steps on both axes."
      - type: note
        title:
          de: Nicht jedes Bauteil ist ohmsch
          en: Not every part is ohmic
        blocks:
          - type: text
            text:
              de: 'Eine Glühlampe wird beim Leuchten heiß, und ihr Widerstand wächst dabei. Ihre Kennlinie ist deshalb
                gebogen und keine Gerade. Für sie gilt $R = \frac{U}{I}$ trotzdem in jedem einzelnen Moment, aber der
                Wert ändert sich.

                '
              en: 'A bulb gets hot when it shines, and its resistance grows. Its characteristic curve is therefore bent,
                not a straight line. $R = \frac{U}{I}$ still holds for it at every single moment, but the value changes.

                '
  - type: section
    id: beispiel
    title:
      de: Beispiel
      en: Example
    blocks:
      - type: example
        title:
          de: Ein Widerstand an der Batterie
          en: A resistor on the battery
        blocks:
          - type: text
            text:
              de: 'Ein Widerstand von 20 Ω liegt an 6 V. Gesucht ist die Stromstärke: $I = \frac{U}{R} = \frac{6 \text{
                V}}{20 \text{ Ω}} = 0{,}3 \text{ A}$. Das Amperemeter zeigt 0,3 A, also 300 mA.

                '
              en: 'A resistor of 20 Ω is connected to 6 V. We want the current: $I = \frac{U}{R} = \frac{6 \text{ V}}{20
                \text{ Ω}} = 0.3 \text{ A}$. The ammeter shows 0.3 A, that is 300 mA.

                '
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
