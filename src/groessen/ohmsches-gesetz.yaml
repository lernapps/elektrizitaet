              en: .
            whyPoints:
              de: Setze mindestens drei Messpunkte bei verschiedenen Spannungen über 0 V.
              en: Record at least three measuring points at different voltages above 0 V.
            whyAnswer:
              de: Trage den Widerstand ein, den du aus den Messpunkten ausrechnest.
              en: Enter the resistance that you calculate from the measuring points.
            whyValue:
              de:
                Der Widerstand stimmt noch nicht. Rechne Spannung geteilt durch Stromstärke, am besten mit einem Messpunkt,
                und gib die Stromstärke in A an.
              en: The resistance is not right yet. Calculate voltage divided by current, best with one measuring point,
                and use the current in A.
            board:
              de: Stromkreis mit einstellbarer Batterie, einem unbekannten Widerstand, Voltmeter und Amperemeter
              en: Circuit with an adjustable battery, an unknown resistor, a voltmeter and an ammeter
            plot:
              de: Diagramm der Messpunkte, Stromstärke über Spannung.
              en: Plot of the measuring points, current over voltage.
            voltage:
              de: "Spannung:"
              en: "Voltage:"
            record:
              de: Messpunkt setzen
              en: Record a measuring point
            points:
              de: "{n} Messpunkte gesetzt"
              en: "{n} measuring points recorded"
            resistance:
              de: "Der Widerstand ist (in Ω):"
              en: "The resistance is (in Ω):"
            hint:
              de: Stelle verschiedene Spannungen ein und setze jeweils einen Messpunkt. Die Punkte zeigen dir, wie der
                Strom von der Spannung abhängt.
              en: Set different voltages and record a point each time. The points show you how the current depends on
                the voltage.
            task:
              de: Der Widerstand im Kreis ist unbekannt. Setze mindestens drei Messpunkte bei verschiedenen Spannungen,
                rechne dann den Widerstand aus und trage ihn ein.
              en: The resistor in the circuit is unknown. Record at least three measuring points at different voltages,
                then calculate the resistance and enter it.
